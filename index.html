<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drod</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Context setup (initialized on first click)
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'die') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.8);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        // Game State
        let state = 'MENU'; // MENU, PLAYING, DEAD
        let score = 0;
        let keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Entities
        let ship, lasers, asteroids, particles;

        function initGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            state = 'PLAYING';
            score = 0;
            ship = {
                x: width / 2, y: height / 2,
                r: 12, a: -Math.PI / 2,
                vx: 0, vy: 0,
                cooldown: 0
            };
            lasers = [];
            asteroids = [];
            particles = [];
            
            for(let i=0; i<5; i++) spawnAsteroid();
        }

        window.addEventListener('mousedown', () => {
            if (state === 'MENU' || state === 'DEAD') initGame();
        });

        function spawnAsteroid(x, y, r) {
            let ast = {
                x: x !== undefined ? x : Math.random() * width,
                y: y !== undefined ? y : (Math.random() > 0.5 ? -50 : height + 50),
                r: r || (Math.random() * 25 + 20),
                vx: (Math.random() - 0.5) * 3,
                vy: (Math.random() - 0.5) * 3,
                verts: []
            };
            // Prevent spawning on top of player initially
            if (x === undefined && Math.hypot(ast.x - width/2, ast.y - height/2) < 150) {
                ast.x = -50; 
            }
            let numVerts = Math.floor(Math.random() * 5 + 7);
            for (let i = 0; i < numVerts; i++) {
                ast.verts.push(ast.r + Math.random() * ast.r * 0.4 - ast.r * 0.2);
            }
            asteroids.push(ast);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.02,
                    color: color
                });
            }
        }

        function update() {
            if (state === 'PLAYING') {
                // Ship thrust & turn
                if (keys['ArrowLeft'] || keys['KeyA']) ship.a -= 0.1;
                if (keys['ArrowRight'] || keys['KeyD']) ship.a += 0.1;
                if (keys['ArrowUp'] || keys['KeyW']) {
                    ship.vx += Math.cos(ship.a) * 0.3;
                    ship.vy += Math.sin(ship.a) * 0.3;
                    // Engine particle
                    particles.push({
                        x: ship.x - Math.cos(ship.a) * ship.r,
                        y: ship.y - Math.sin(ship.a) * ship.r,
                        vx: -Math.cos(ship.a) * 5 + (Math.random()-0.5)*2,
                        vy: -Math.sin(ship.a) * 5 + (Math.random()-0.5)*2,
                        life: 1, decay: 0.05, color: '#00ffff'
                    });
                }
                
                // Friction
                ship.vx *= 0.98; ship.vy *= 0.98;
                ship.x += ship.vx; ship.y += ship.vy;

                // Screen wrap
                if (ship.x < 0) ship.x = width; if (ship.x > width) ship.x = 0;
                if (ship.y < 0) ship.y = height; if (ship.y > height) ship.y = 0;

                // Shooting
                if (ship.cooldown > 0) ship.cooldown--;
                if (keys['Space'] && ship.cooldown === 0) {
                    lasers.push({
                        x: ship.x + Math.cos(ship.a) * ship.r,
                        y: ship.y + Math.sin(ship.a) * ship.r,
                        vx: Math.cos(ship.a) * 15,
                        vy: Math.sin(ship.a) * 15,
                        life: 60
                    });
                    ship.cooldown = 15;
                    playSound('shoot');
                }
            }

            // Update Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].x += lasers[i].vx;
                lasers[i].y += lasers[i].vy;
                lasers[i].life--;
                if (lasers[i].life <= 0) lasers.splice(i, 1);
            }

            // Update Asteroids & Collisions
            for (let i = asteroids.length - 1; i >= 0; i--) {
                let a = asteroids[i];
                a.x += a.vx; a.y += a.vy;

                if (a.x < -a.r) a.x = width + a.r; if (a.x > width + a.r) a.x = -a.r;
                if (a.y < -a.r) a.y = height + a.r; if (a.y > height + a.r) a.y = -a.r;

                // Ship collision
                if (state === 'PLAYING') {
                    let dist = Math.hypot(ship.x - a.x, ship.y - a.y);
                    if (dist < ship.r + a.r * 0.8) {
                        createExplosion(ship.x, ship.y, '#00ffff');
                        playSound('die');
                        state = 'DEAD';
                        setTimeout(() => state = 'MENU', 2000);
                    }
                }

                // Laser collision
                for (let j = lasers.length - 1; j >= 0; j--) {
                    let l = lasers[j];
                    if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
                        createExplosion(a.x, a.y, '#ff0055');
                        playSound('boom');
                        
                        // 20% chance to split if big enough
                        if (Math.random() < 0.20 && a.r > 15) {
                            spawnAsteroid(a.x, a.y, a.r / 1.5);
                            spawnAsteroid(a.x, a.y, a.r / 1.5);
                        }
                        
                        asteroids.splice(i, 1);
                        lasers.splice(j, 1);
                        score += 100;
                        if (asteroids.length < 3) spawnAsteroid(); // Keep game populated
                        break;
                    }
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= particles[i].decay;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.4)'; // Trail effect
            ctx.fillRect(0, 0, width, height);

            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Draw Particles
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.life * 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;

            // Draw Asteroids
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            asteroids.forEach(a => {
                ctx.beginPath();
                for (let i = 0; i < a.verts.length; i++) {
                    let angle = (i / a.verts.length) * Math.PI * 2;
                    let rx = a.x + Math.cos(angle) * a.verts[i];
                    let ry = a.y + Math.sin(angle) * a.verts[i];
                    if (i === 0) ctx.moveTo(rx, ry);
                    else ctx.lineTo(rx, ry);
                }
                ctx.closePath();
                ctx.stroke();
            });

            // Draw Lasers
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0055';
            lasers.forEach(l => {
                ctx.beginPath();
                ctx.moveTo(l.x, l.y);
                ctx.lineTo(l.x - l.vx*0.5, l.y - l.vy*0.5);
                ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Draw Ship
            if (state === 'PLAYING') {
                ctx.save();
                ctx.translate(ship.x, ship.y);
                ctx.rotate(ship.a);
                ctx.strokeStyle = '#00ffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ship.r, 0);
                ctx.lineTo(-ship.r, -ship.r * 0.7);
                ctx.lineTo(-ship.r * 0.5, 0);
                ctx.lineTo(-ship.r, ship.r * 0.7);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // Draw UI
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            if (state === 'MENU') {
                ctx.font = 'bold 72px Courier New';
                ctx.fillText('DROD', width / 2, height / 2 - 20);
                ctx.font = '24px Courier New';
                ctx.fillText('CLICK TO START', width / 2, height / 2 + 40);
            } else if (state === 'DEAD') {
                ctx.font = 'bold 72px Courier New';
                ctx.fillText('DESTROYED', width / 2, height / 2 - 20);
            }

            if (state === 'PLAYING' || state === 'DEAD') {
                ctx.font = '20px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText(`SCORE: ${score}`, 20, 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        
        loop();
    </script>
</body>
</html>
