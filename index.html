<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drod</title>
    <link href="https://fonts.cdnfonts.com/css/space-age" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050512; overflow: hidden;
            font-family: 'PT Serif', serif; color: #fff; user-select: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let audioCtx;
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            // Reduced volume and optimized envelopes
            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'boom') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'beam') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'die') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.8);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        let state = 'MENU';
        let score = 0;
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        let ship, lasers, enemyLasers, asteroids, bgAsteroids, enemies, particles, stars;
        let frameCount = 0;

        function initEnvironment() {
            stars = []; bgAsteroids = [];
            for(let i=0; i<150; i++) stars.push({ x: Math.random()*width, y: Math.random()*height, z: Math.random()*3+1 });
            for(let i=0; i<8; i++) {
                let ast = {
                    x: Math.random()*width, y: Math.random()*height, r: Math.random()*40+30,
                    vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, rot: Math.random()*Math.PI*2,
                    rotSpeed: (Math.random()-0.5)*0.02, verts: []
                };
                let numVerts = Math.floor(Math.random()*5+7);
                for (let j=0; j<numVerts; j++) ast.verts.push(ast.r + Math.random()*ast.r*0.4 - ast.r*0.2);
                bgAsteroids.push(ast);
            }
        }
        initEnvironment();

        function initGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            state = 'PLAYING'; score = 0; frameCount = 0;
            ship = { x: width/2, y: height/2, r: 10, a: -Math.PI/2, vx: 0, vy: 0, cooldown: 0 };
            lasers = []; enemyLasers = []; asteroids = []; enemies = []; particles = [];
            for(let i=0; i<6; i++) spawnAsteroid();
        }

        window.addEventListener('mousedown', () => { if (state === 'MENU' || state === 'DEAD') initGame(); });

        function spawnAsteroid(x, y, r) {
            let ast = {
                x: x !== undefined ? x : Math.random() > 0.5 ? -50 : width + 50,
                y: y !== undefined ? y : Math.random() * height,
                r: r || (Math.random()*25+20),
                vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, verts: []
            };
            let numVerts = Math.floor(Math.random()*5+7);
            for (let i=0; i<numVerts; i++) ast.verts.push(ast.r + Math.random()*ast.r*0.4 - ast.r*0.2);
            asteroids.push(ast);
        }

        function spawnEnemy() {
            // Type 0: Hunter, Type 1: Spinner, Type 2: Beamer
            let type = Math.floor(Math.random() * 3);
            enemies.push({
                type: type,
                x: Math.random() > 0.5 ? -30 : width + 30, y: Math.random() * height,
                r: type === 2 ? 18 : 14, a: 0, vx: 0, vy: 0,
                cooldown: type === 2 ? 200 : 90, charge: 0, beam: null
            });
        }

        function createExplosion(x, y, color, amount=12) {
            for (let i=0; i<amount; i++) {
                particles.push({
                    x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                    life: 1, decay: Math.random()*0.03 + 0.03, color: color
                });
            }
        }

        function killPlayer() {
            createExplosion(ship.x, ship.y, '#00ffff', 30);
            playSound('die'); state = 'DEAD';
            setTimeout(() => state = 'MENU', 2500);
        }

        function update() {
            frameCount++;

            let driftX = state === 'PLAYING' ? ship.vx : 0.5;
            let driftY = state === 'PLAYING' ? ship.vy : 0;
            
            stars.forEach(s => {
                s.x -= driftX / s.z; s.y -= driftY / s.z;
                if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
                if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;
            });
            bgAsteroids.forEach(a => {
                a.x += a.vx - (driftX*0.2); a.y += a.vy - (driftY*0.2); a.rot += a.rotSpeed;
                if (a.x < -a.r*2) a.x = width+a.r*2; if (a.x > width+a.r*2) a.x = -a.r*2;
                if (a.y < -a.r*2) a.y = height+a.r*2; if (a.y > height+a.r*2) a.y = -a.r*2;
            });

            if (state === 'PLAYING') {
                // Tighter Controls
                if (keys['ArrowLeft'] || keys['KeyA']) ship.a -= 0.09;
                if (keys['ArrowRight'] || keys['KeyD']) ship.a += 0.09;
                if (keys['ArrowUp'] || keys['KeyW']) {
                    ship.vx += Math.cos(ship.a) * 0.25; ship.vy += Math.sin(ship.a) * 0.25;
                    particles.push({
                        x: ship.x - Math.cos(ship.a)*ship.r, y: ship.y - Math.sin(ship.a)*ship.r,
                        vx: -Math.cos(ship.a)*4 + (Math.random()-0.5)*2, vy: -Math.sin(ship.a)*4 + (Math.random()-0.5)*2,
                        life: 1, decay: 0.08, color: '#00ffff'
                    });
                }
                
                ship.vx *= 0.94; ship.vy *= 0.94; // Higher friction
                ship.x += ship.vx; ship.y += ship.vy;
                if (ship.x < 0) ship.x = width; if (ship.x > width) ship.x = 0;
                if (ship.y < 0) ship.y = height; if (ship.y > height) ship.y = 0;

                if (ship.cooldown > 0) ship.cooldown--;
                if (keys['Space'] && ship.cooldown === 0) {
                    lasers.push({
                        x: ship.x + Math.cos(ship.a)*ship.r, y: ship.y + Math.sin(ship.a)*ship.r,
                        vx: Math.cos(ship.a)*22, vy: Math.sin(ship.a)*22, life: 50
                    });
                    ship.cooldown = 12; playSound('shoot');
                }

                // Dynamic Spawning
                if (frameCount % 300 === 0 && enemies.length < 4) spawnEnemy();
                if (frameCount % 150 === 0 && asteroids.length < 10) spawnAsteroid(); // Asteroids spawn during game
            }

            // Homing Player Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                let closest = 200; let target = null;
                asteroids.forEach(a => { let d = Math.hypot(l.x-a.x, l.y-a.y); if(d<closest){ closest=d; target=a; }});
                enemies.forEach(e => { let d = Math.hypot(l.x-e.x, l.y-e.y); if(d<closest){ closest=d; target=e; }});
                
                if (target) {
                    let speed = Math.hypot(l.vx, l.vy);
                    let targetAngle = Math.atan2(target.y - l.y, target.x - l.x);
                    let currentAngle = Math.atan2(l.vy, l.vx);
                    let diff = targetAngle - currentAngle;
                    while(diff < -Math.PI) diff += Math.PI*2;
                    while(diff > Math.PI) diff -= Math.PI*2;
                    currentAngle += diff * 0.12; // Homing strength
                    l.vx = Math.cos(currentAngle) * speed; l.vy = Math.sin(currentAngle) * speed;
                }

                l.x += l.vx; l.y += l.vy; l.life--;
                if (l.life <= 0) lasers.splice(i, 1);
            }

            for (let i = enemyLasers.length - 1; i >= 0; i--) {
                enemyLasers[i].x += enemyLasers[i].vx; enemyLasers[i].y += enemyLasers[i].vy;
                enemyLasers[i].life--;
                if (state === 'PLAYING' && Math.hypot(enemyLasers[i].x - ship.x, enemyLasers[i].y - ship.y) < ship.r + 5) {
                    killPlayer(); enemyLasers.splice(i, 1); continue;
                }
                if (enemyLasers[i].life <= 0) enemyLasers.splice(i, 1);
            }

            // Enemies Update & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let destroyed = false;

                // Asteroid Collision
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    let a = asteroids[j];
                    if (Math.hypot(e.x - a.x, e.y - a.y) < e.r + a.r) {
                        if (e.type === 1) { // Spinner bounces
                            let bounce = Math.atan2(e.y - a.y, e.x - a.x);
                            e.vx = Math.cos(bounce)*3; e.vy = Math.sin(bounce)*3;
                        } else {
                            createExplosion(e.x, e.y, '#ff3333');
                            enemies.splice(i, 1); destroyed = true; break;
                        }
                    }
                }
                if (destroyed) continue;

                // Laser Collision
                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (Math.hypot(lasers[j].x - e.x, lasers[j].y - e.y) < e.r + 15) {
                        createExplosion(e.x, e.y, '#ff3333'); playSound('boom');
                        enemies.splice(i, 1); lasers.splice(j, 1); score += (e.type+1)*250;
                        destroyed = true; break;
                    }
                }
                if (destroyed) continue;

                if (state === 'PLAYING') {
                    if (Math.hypot(ship.x - e.x, ship.y - e.y) < ship.r + e.r) { killPlayer(); continue; }

                    if (e.type === 0) { // Hunter
                        let angleToPlayer = Math.atan2(ship.y - e.y, ship.x - e.x);
                        e.a = angleToPlayer; e.vx += Math.cos(e.a)*0.1; e.vy += Math.sin(e.a)*0.1;
                        e.cooldown--;
                        if (e.cooldown <= 0 && Math.hypot(ship.x-e.x, ship.y-e.y) < 400) {
                            enemyLasers.push({ x: e.x+Math.cos(e.a)*e.r, y: e.y+Math.sin(e.a)*e.r, vx: Math.cos(e.a)*10, vy: Math.sin(e.a)*10, life: 60 });
                            e.cooldown = 90;
                        }
                    } 
                    else if (e.type === 1) { // Spinner
                        e.a += 0.08; e.vx *= 0.99; e.vy *= 0.99; // Bounces around
                        e.cooldown--;
                        if (e.cooldown <= 0) {
                            for(let k=0; k<3; k++) {
                                let angle = e.a + (k*(Math.PI*2/3));
                                enemyLasers.push({ x: e.x+Math.cos(angle)*e.r, y: e.y+Math.sin(angle)*e.r, vx: Math.cos(angle)*7, vy: Math.sin(angle)*7, life: 60 });
                            }
                            e.cooldown = 120;
                        }
                    } 
                    else if (e.type === 2) { // Beamer
                        let angleToPlayer = Math.atan2(ship.y - e.y, ship.x - e.x);
                        let diff = angleToPlayer - e.a;
                        while(diff < -Math.PI) diff += Math.PI*2;
                        while(diff > Math.PI) diff -= Math.PI*2;
                        e.a += diff * 0.03; // Turn slowly
                        e.vx += Math.cos(e.a)*0.03; e.vy += Math.sin(e.a)*0.03;
                        
                        e.cooldown--;
                        if (e.cooldown > 50) e.charge = 0;
                        else if (e.cooldown <= 50 && e.cooldown > 0) e.charge = (50 - e.cooldown) / 50;
                        else if (e.cooldown === 0) {
                            let bLen = 1500;
                            e.beam = { x: e.x + Math.cos(e.a)*bLen, y: e.y + Math.sin(e.a)*bLen, life: 15 };
                            playSound('beam'); e.cooldown = 250; e.charge = 0;
                            
                            // Beam Math (Line-Point collision)
                            let A = ship.x - e.x; let B = ship.y - e.y;
                            let C = e.beam.x - e.x; let D = e.beam.y - e.y;
                            let dot = A*C + B*D; let len_sq = C*C + D*D;
                            let param = -1; if (len_sq != 0) param = dot / len_sq;
                            let xx, yy;
                            if (param < 0) { xx = e.x; yy = e.y; }
                            else if (param > 1) { xx = e.beam.x; yy = e.beam.y; }
                            else { xx = e.x + param*C; yy = e.y + param*D; }
                            if (Math.hypot(ship.x - xx, ship.y - yy) < ship.r + 15) killPlayer();
                        }
                        if (e.beam && e.beam.life > 0) e.beam.life--;
                    }
                }
                e.vx *= 0.98; e.vy *= 0.98; e.x += e.vx; e.y += e.vy;
                if (e.x < -50) e.x = width+50; if (e.x > width+50) e.x = -50;
                if (e.y < -50) e.y = height+50; if (e.y > height+50) e.y = -50;
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                let a = asteroids[i];
                a.x += a.vx; a.y += a.vy;
                if (a.x < -a.r) a.x = width + a.r; if (a.x > width + a.r) a.x = -a.r;
                if (a.y < -a.r) a.y = height + a.r; if (a.y > height + a.r) a.y = -a.r;

                if (state === 'PLAYING' && Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r * 0.8) killPlayer();

                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (Math.hypot(lasers[j].x - a.x, lasers[j].y - a.y) < a.r + 15) { 
                        createExplosion(a.x, a.y, '#ff00ff'); playSound('boom');
                        if (Math.random() < 0.25 && a.r > 15) {
                            spawnAsteroid(a.x, a.y, a.r / 1.5); spawnAsteroid(a.x, a.y, a.r / 1.5);
                        }
                        asteroids.splice(i, 1); lasers.splice(j, 1); score += 100;
                        break;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                particles[i].life -= particles[i].decay;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            // Fixes permanent dead pixels by forcing mathematical round-down occasionally
            ctx.fillStyle = 'rgba(5, 5, 18, 0.35)'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(5, 5, 18, 0.05)'; ctx.fillRect(0, 0, width, height); 

            ctx.lineJoin = 'round'; ctx.lineCap = 'round';

            // Z-Index: Background drawn over trails
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => { ctx.globalAlpha = 1/s.z; ctx.beginPath(); ctx.arc(s.x, s.y, 1.5/s.z, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; ctx.lineWidth = 1;
            bgAsteroids.forEach(a => {
                ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
                ctx.beginPath();
                for (let i=0; i<a.verts.length; i++) {
                    let ang = (i/a.verts.length)*Math.PI*2;
                    let rx = Math.cos(ang)*a.verts[i]; let ry = Math.sin(ang)*a.verts[i];
                    if (i===0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
                }
                ctx.closePath(); ctx.stroke(); ctx.restore();
            });

            // Particles
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.life*4, 0, Math.PI*2);
                ctx.fillStyle = p.color; ctx.shadowBlur = 12; ctx.shadowColor = p.color; ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;

            // Asteroids
            ctx.strokeStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 5; ctx.lineWidth = 2;
            asteroids.forEach(a => {
                ctx.beginPath();
                for (let i=0; i<a.verts.length; i++) {
                    let ang = (i/a.verts.length)*Math.PI*2;
                    let rx = a.x + Math.cos(ang)*a.verts[i]; let ry = a.y + Math.sin(ang)*a.verts[i];
                    if (i===0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
                }
                ctx.closePath(); ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Enemies
            enemies.forEach(e => {
                ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.a);
                ctx.strokeStyle = '#ff3333'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff3333'; ctx.lineWidth = 2;
                ctx.beginPath();
                
                if (e.type === 0) { // Hunter
                    ctx.moveTo(e.r, 0); ctx.lineTo(-e.r, -e.r*0.8);
                    ctx.lineTo(-e.r*0.4, 0); ctx.lineTo(-e.r, e.r*0.8);
                } else if (e.type === 1) { // Spinner (Star Shape)
                    for(let k=0; k<6; k++) {
                        let rad = k%2===0 ? e.r : e.r*0.4;
                        let ang = (k/6)*Math.PI*2;
                        if(k===0) ctx.moveTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
                        else ctx.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
                    }
                } else if (e.type === 2) { // Beamer (Longer, with back indent & charge)
                    ctx.moveTo(e.r, 0); ctx.lineTo(-e.r, -e.r*0.9);
                    ctx.lineTo(-e.r*0.2, 0); ctx.lineTo(-e.r, e.r*0.9);
                    // Internal indent line for design
                    ctx.moveTo(-e.r*0.6, -e.r*0.4); ctx.lineTo(-e.r*0.1, 0); ctx.lineTo(-e.r*0.6, e.r*0.4);
                    
                    if (e.charge > 0) {
                        ctx.beginPath(); ctx.arc(e.r, 0, e.charge*8, 0, Math.PI*2);
                        ctx.fillStyle = '#ff3333'; ctx.fill(); ctx.beginPath();
                    }
                }
                ctx.closePath(); ctx.stroke(); ctx.restore();

                // Draw Beam
                if (e.type === 2 && e.beam && e.beam.life > 0) {
                    ctx.strokeStyle = '#ff3333'; ctx.lineWidth = e.beam.life; 
                    ctx.shadowBlur = 20; ctx.beginPath();
                    ctx.moveTo(e.x, e.y); ctx.lineTo(e.beam.x, e.beam.y); ctx.stroke(); ctx.shadowBlur = 0;
                }
            });

            // Lasers
            ctx.lineWidth = 3;
            lasers.forEach(l => {
                ctx.strokeStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - l.vx*0.6, l.y - l.vy*0.6); ctx.stroke();
            });
            enemyLasers.forEach(l => {
                ctx.strokeStyle = '#ff3333'; ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - l.vx*0.6, l.y - l.vy*0.6); ctx.stroke();
            });
            ctx.shadowBlur = 0;

            // Ship
            if (state === 'PLAYING') {
                ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
                ctx.strokeStyle = '#00ffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(ship.r, 0); ctx.lineTo(-ship.r, -ship.r*0.7);
                ctx.lineTo(-ship.r*0.5, 0); ctx.lineTo(-ship.r, ship.r*0.7);
                ctx.closePath(); ctx.stroke(); ctx.restore();
            }

            // UI
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
            if (state === 'MENU') {
                ctx.font = '72px "Space Age", sans-serif'; ctx.shadowBlur = 15; ctx.shadowColor = '#fff';
                ctx.fillText('DROD', width/2, height/2 - 20); ctx.shadowBlur = 0;
                ctx.font = '24px "PT Serif", serif';
                ctx.fillText('CLICK TO START', width/2, height/2 + 50);
            } else if (state === 'DEAD') {
                ctx.font = '64px "Space Age", sans-serif';
                ctx.fillStyle = '#ff3333'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff3333';
                ctx.fillText('DESTROYED', width/2, height/2 - 20); ctx.shadowBlur = 0;
            }

            if (state === 'PLAYING' || state === 'DEAD') {
                ctx.font = '24px "Space Age", sans-serif'; ctx.textAlign = 'left';
                ctx.fillStyle = '#fff'; ctx.fillText(`SCORE: ${score}`, 30, 50);
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
